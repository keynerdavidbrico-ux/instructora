{% extends "base.html" %}
{% block titulo %}Par o impar{% endblock %}

{% block contenido %}
<main class="hoja">
    <a href="/" class="volver">&larr; Volver a los ejercicios</a>
    <h1>Par o impar</h1>
    <p>Escribe un número entero y te digo si es par o impar.</p>

    <form method="POST" class="formulario">
        <label for="numero">Número</label>
        <div class="campo">
            <input type="number" id="numero" name="numero" required autofocus>
            <button type="submit">Comprobar</button>
        </div>
    </form>

    {% if aviso %}<div class="aviso" role="alert">{{ aviso }}</div>{% endif %}
    {% if resultado %}<div class="resultado" role="status">{{ resultado }}</div>{% endif %}
</main>
{% endblock %}
