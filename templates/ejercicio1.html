<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Par o impar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="ejercicio">
        <a href="/" class="volver">← Volver al menú</a>
        <span class="badge">Ejercicio 1</span>
        <h1>Par o impar</h1>
        <p>Escribe un número y descubre si es par o impar.</p>

        <form method="POST" class="formulario">
            <label for="numero">Número:</label>
            <input type="number" id="numero" name="numero" required>
            <button type="submit">Comprobar</button>
        </form>

        {% if resultado %}<div class="resultado">{{ resultado }}</div>{% endif %}
        {% if tabla %}
        <div class="tabla">
            <h3>Resultado</h3>
            {% for linea in tabla %}<div class="fila">{{ linea }}</div>{% endfor %}
        </div>
        {% endif %}
    </main>
</body>
</html>
